# 本机部署用的 nginx 配置：三端静态页面，/api/ 转给后端容器。没有课程视频，不配 /vod。
server {
    listen 80;
    server_name _;
    # 跳转只给路径，不拼主机与端口。否则改了 WEB_PORT 之后，访问根路径会被跳到 80 端口。
    absolute_redirect off;

    location = / { return 302 /study/; }

    location /api/ {
        proxy_pass http://backend:8801;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_connect_timeout 5s;
        # 懂妈答疑是流式输出，检索加生成可能要一两分钟，读超时放宽，并关掉缓冲让字一个个出来。
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
        client_max_body_size 4m;
    }

    location = /study { return 301 /study/; }
    location /study/ { alias /usr/share/nginx/html/study/; try_files $uri $uri/ /study/index.html; }
    location = /agent { return 301 /agent/; }
    location /agent/ { alias /usr/share/nginx/html/agent/; try_files $uri $uri/ /agent/index.html; }
    location = /admin { return 301 /admin/; }
    location /admin/ { alias /usr/share/nginx/html/admin/; try_files $uri $uri/ /admin/index.html; }

    location / { return 404; }
}
